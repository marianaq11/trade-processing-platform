spring:
  application:
    name: trade-platform
  # Local dev defaults matching docker-compose.yml. Override with SPRING_DATASOURCE_* env vars elsewhere.
  datasource:
    url: jdbc:postgresql://localhost:5432/trades
    username: trades
    password: trades
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Off so lazy loading can't quietly run queries while JSON is being written.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      # Otherwise a quantity of 1.5 quietly becomes 1.
      accept-float-as-int: false
  flyway:
    # db/demo adds sample trade history for local runs. Tests only load db/migration.
    locations: classpath:db/migration,classpath:db/demo

server:
  servlet:
    session:
      cookie:
        # CSRF tokens already protect state-changing requests; this is a second layer.
        same-site: lax

settlement:
  # Weekdays at 6pm New York time, after the market closes.
  cron: "0 0 18 * * MON-FRI"
