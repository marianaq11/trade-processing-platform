# docker compose up --build        whole app on http://localhost:3000
# docker compose up -d postgres    only the database, for running the backend and frontend yourself
#
# The database password is a local development default, not a secret. Set POSTGRES_PASSWORD in a
# .env file (ignored by git) to use something else.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trades
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trades}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades -d trades"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trades
      SPRING_DATASOURCE_USERNAME: trades
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-trades}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
