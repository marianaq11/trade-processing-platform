server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser only ever talks to this server, so the session cookie and CSRF token work
    # the same way they do with the Vite dev server's proxy.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paths like /trades/12 are React Router routes, not files.
    location / {
        try_files $uri /index.html;
    }
}
