# PostgreSQL 17, the same image docker-compose.yml uses. The password comes from the
# postgres-credentials Secret, which you create yourself (see k8s/README.md); it isn't in git.

# kind's default StorageClass keeps this volume inside the kind node container: it survives pod
# restarts and redeploys, and is deleted with the namespace or the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: trade-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: trade-platform
spec:
  replicas: 1
  # Only one Postgres may use the data directory, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Leave out the POSTGRES_PORT=tcp://... style variables Kubernetes adds for each Service.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: trades
            - name: POSTGRES_USER
              value: trades
            # Only read when the data directory is first created; see k8s/README.md.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # A subdirectory of the volume, so initdb never finds files it didn't create.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # -h 127.0.0.1 checks over TCP: while initdb runs on first start, Postgres only listens on
          # a Unix socket, and the backend can't connect yet.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "trades", "-d", "trades"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "trades", "-d", "trades"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "trades", "-d", "trades"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
# Reachable only inside the cluster, as postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trade-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
